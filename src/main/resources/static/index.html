<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Filmes</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Instrument+Sans:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topo">
    <div class="marca">
        <h1>Cadastro de Filmes</h1>
        <p id="contagem"></p>
    </div>

    <input
            id="busca"
            class="campo busca"
            type="search"
            aria-label="Buscar filmes"
            placeholder="Buscar filme, diretor, ano ou ID"
    >

    <button id="novoFilme" class="botao botao-principal" type="button">
        Novo filme
    </button>
</header>

<main class="conteudo">
    <ul id="acervo" class="acervo"></ul>

    <div id="aviso" class="aviso" hidden>
        <p id="avisoTexto"></p>
        <button id="avisoAcao" class="botao botao-principal" type="button"></button>
    </div>
</main>

<dialog id="painel" class="painel" aria-labelledby="painelTitulo">
    <form id="formulario" class="formulario">
        <header class="formulario-topo">
            <h2 id="painelTitulo"></h2>
            <button id="fecharPainel" class="botao-fechar" type="button" aria-label="Fechar">&times;</button>
        </header>

        <div class="formulario-campos">
            <label>
                Título
                <input class="campo" name="titulo" required pattern=".*\S.*" maxlength="255">
            </label>

            <label>
                Diretor
                <input class="campo" name="diretor" required pattern=".*\S.*" maxlength="255">
            </label>

            <label>
                Gênero
                <input class="campo" name="genero" required pattern=".*\S.*" maxlength="255">
            </label>

            <label>
                Ano de lançamento
                <input class="campo" name="anoLancamento" type="number" required min="1888" max="2100" step="1">
            </label>

            <p id="erroPainel" class="erro" role="alert" hidden></p>
        </div>

        <footer class="formulario-rodape">
            <button id="excluirFilme" class="botao botao-perigo" type="button"></button>
            <button id="salvarFilme" class="botao botao-principal" type="submit"></button>
        </footer>
    </form>
</dialog>

<div id="recado" class="recado" role="status" hidden></div>

<script type="module" src="script.js"></script>

</body>

</html>
