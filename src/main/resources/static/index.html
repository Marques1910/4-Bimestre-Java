<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Filmes</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🎬 Cadastro de Filmes</h1>

<!-- CADASTRAR FILME -->

<h2>Cadastrar Filme</h2>

<input
        type="text"
        id="titulo"
        placeholder="Título do filme"
>

<input
        type="text"
        id="diretor"
        placeholder="Diretor"
>

<input
        type="text"
        id="genero"
        placeholder="Gênero"
>

<input
        type="number"
        id="anoLancamento"
        placeholder="Ano de lançamento"
>

<button onclick="criar()">
    Salvar
</button>


<hr>


<!-- BUSCAR FILME -->

<h2>Buscar Filme</h2>

<input
        type="number"
        id="buscarId"
        placeholder="ID do filme"
>

<button onclick="buscar()">
    Buscar
</button>

<div id="resultadoBuscar"></div>


<hr>


<!-- DELETAR FILME -->

<h2>Deletar Filme</h2>

<input
        type="number"
        id="deletarId"
        placeholder="ID do filme"
>

<button onclick="deletar()">
    Deletar
</button>


<hr>


<!-- ATUALIZAR FILME -->

<h2>Atualizar Filme</h2>

<input
        type="number"
        id="id"
        placeholder="ID do filme"
>

<input
        type="text"
        id="novoTitulo"
        placeholder="Novo título"
>

<input
        type="text"
        id="novoDiretor"
        placeholder="Novo diretor"
>

<input
        type="text"
        id="novoGenero"
        placeholder="Novo gênero"
>

<input
        type="number"
        id="novoAnoLancamento"
        placeholder="Novo ano de lançamento"
>

<button onclick="atualizar()">
    Atualizar
</button>


<script src="script.js"></script>

</body>

</html>
