spring.application.name=cadastro-filmes

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/cadastro_filmes
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Envia ao frontend a mensagem de erro definida no backend
spring.web.error.include-message=always

# Token do TMDB, em arquivo fora do Git (veja o README)
spring.config.import=optional:file:./tmdb.properties
